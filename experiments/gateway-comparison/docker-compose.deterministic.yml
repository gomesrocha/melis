# Gateway comparison — DETERMINISTIC profile.
#
# Three measurable paths to the SAME deterministic backend:
#   - direct:  client -> backend:7070            (host port 7070)
#   - melis:   client -> melis:7071   -> backend  (host port 7071)
#   - litellm: client -> litellm:4000 -> backend  (host port 4000)
#
# Run gateways SEPARATELY (via profiles) to avoid resource interference when
# measuring; the backend is shared and stateless + reproducible. Ports chosen to
# avoid host conflicts (8080/8081/11434 are in use on this machine).
#
# Nothing here uses real credentials. Images are pinned by digest where external.

services:
  backend:
    # python:3.12-slim pinned by digest (resolved via scripts/pin_images.sh).
    image: python@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
    working_dir: /app
    command: ["python", "/app/mock_openai.py"]
    environment:
      MOCK_PORT: "7070"
      MOCK_LATENCY_MS: "0"
    volumes:
      - ./backend-deterministic/mock_openai.py:/app/mock_openai.py:ro
    ports:
      - "127.0.0.1:7070:7070"
    # Pin resources so overhead numbers are comparable (document in the report).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"

  melis:
    build:
      context: ../..            # the Melis worktree root (candidate commit)
      dockerfile: Dockerfile
    environment:
      MELIS_SERVER_PORT: "7071"
    volumes:
      - ./melis/config.deterministic.yaml:/app/config.yaml:ro
      - ./melis/routes.deterministic.yaml:/etc/melis/routes.yaml:ro
    ports:
      - "127.0.0.1:7071:7071"
    depends_on:
      - backend
    profiles: ["melis"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"

  litellm:
    image: ghcr.io/berriai/litellm@sha256:6c82d338a60e7b273ae46bf1d8db814d2856ae010f96c44eeadde574d3893f76
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    volumes:
      - ./litellm/config.deterministic.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      - backend
    profiles: ["litellm"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2G"   # LiteLLM v1.83.10 OOMs under 512M; raised + documented (does not favor Melis)
