# Melis config — DETERMINISTIC profile, MINIMAL MEDIATION.
# No cache, no compaction, no guardrails. Auth disabled (equivalent on all paths).
# The mock backend is a single provider; no retries/fallback (one provider only).
server:
  host: "0.0.0.0"
  port: 7071

redis:
  # Not used in the minimal profile (circuit_breaker backend is "local"; no cache).
  # A URL is required by config validation; this loopback is never dialed for a
  # request (only a harmless background reachability retry logs a warning).
  cluster_urls:
    - "redis://127.0.0.1:6379"
  required_for_readiness: false

auth:
  enabled: false
  api_keys: []

observability:
  enabled: false
  service_name: "melis-exp"

# Global compactor defaults are irrelevant: routes use strategy "none" (no
# compaction). token_threshold must be in [512, 128000]; set to the max so it
# never triggers, and strategy "none" disables compaction regardless.
compactor:
  token_threshold: 128000
  strategy: "none"

circuit_breaker:
  backend: "local"

providers:
  - id: "mockbackend"
    provider_type: "openai"
    api_key: "unused"
    # Overridden by MELIS_* env or left to the compose network; see routes.
    base_url: "http://backend:7070/v1"

routes_config_path: "/etc/melis/routes.yaml"
